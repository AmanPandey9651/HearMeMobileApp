name: feelback_ringtone
description: Native singleton call ringtone manager for FeelBack
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.harto.feelback.ringtone
        pluginClass: FeelBackRingtonePlugin
      ios:
        pluginClass: FeelBackRingtonePlugin
