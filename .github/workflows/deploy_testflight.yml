name: Deploy to TestFlight & App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS Build Number'
        required: true
        default: '81'

jobs:
  deploy:
    name: Build Signed IPA & Upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          xcodebuild -version
          fastlane --version

      - name: Install Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Configure Fastlane & Run Deployment
        env:
          APP_STORE_CONNECT_KEY_ID: "P62A9B4S3C"
          APP_STORE_CONNECT_ISSUER_ID: "ee73bce7-c132-4a6c-942e-ebb228885b87"
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '81' }}
        run: |
          cd ios
          fastlane beta

      - name: Upload Signed IPA as Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeelBack-Signed-iOS-IPA
          path: |
            build/ios/ipa/*.ipa
            ios/*.cer
            ios/*.p12
            ios/*.mobileprovision
          retention-days: 14
