
name: talkstrangersmobile
description: Flutter mobile client for the FeelBack user and listener platform.
publish_to: 'none'

version: 1.2.48+80

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Google Sign-In
  google_sign_in: 7.2.0

  # Firebase
  firebase_auth: 7.0.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1

  # Images and permissions
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Audio and video calling
  flutter_webrtc: 1.6.2+hotfix.3
  flutter_callkit_incoming: ^3.1.6
  flutter_ringtone_player: ^4.0.0+4
  flutter_local_notifications: ^22.3.3
  vibration: ^3.2.1

  # Payments
  razorpay_flutter: 1.4.0

  # Other utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.14.1
  speech_to_text: ^7.4.0

  # FeelBack custom ringtone
  feelback_ringtone:
    path: ./packages/feelback_ringtone

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  google_sign_in_ios: 6.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/feelagain-logo.png
    - assets/images/feelagain-splash.png
    - assets/images/feelback-logo.png
    - assets/images/feelback-logo-white.png
    - assets/images/feelback-splash.png
