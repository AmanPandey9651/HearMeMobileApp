name: talkstrangersmobile
description: Flutter mobile client for the TalkStrangers/Feelback user and listener platform.
publish_to: 'none'
version: 1.2.3+29

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  razorpay_flutter: ^1.3.7

  # IMPORTANT:
  # Old version 0.12.12 has an old Android WebRTC/camera implementation.
  flutter_webrtc: 1.6.2+hotfix.3

  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_ringtone_player: ^4.0.0+4
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/feelagain-logo.png
    - assets/images/feelagain-splash.png
    - assets/images/feelback-logo.png
    - assets/images/feelback-logo-white.png
    - assets/images/feelback-splash.png
